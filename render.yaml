# Render Blueprint: one web service that builds the React client and serves it,
# together with the API, from the Express server (same origin, no CORS setup).
services:
  - type: web
    name: footzi
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # MongoDB Atlas connection string; you are prompted for it when the Blueprint is created
      - key: MONGODB_URI
        sync: false
      # Optional, add later in the dashboard to leave demo mode:
      #   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
      #   BREVO_API_KEY or RESEND_API_KEY, plus EMAIL_FROM   (order and password-reset emails)
      #   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
